#
# btrbk test configuration - local simple send-receive
#
# This configuration is used for testing local backups with send-receive.
# Variables are expanded from the test environment.
#

# Use long timestamp format for easier debugging
timestamp_format        long

# Preserve everything during tests (no automatic deletion)
snapshot_preserve_min   all
target_preserve_min     all

# Disable transaction log for tests (simpler output)
transaction_log         no

# Snapshot directory (relative to volume)
snapshot_dir            snapshots

# Volume and subvolume configuration
# Note: TESTROOT is set by the test environment
volume ${TESTROOT}
  subvolume data
    target ${TESTROOT}/backup
